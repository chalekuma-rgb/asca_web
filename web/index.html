<head>

  <meta property="og:title" content="Ardaita and its Surrounding Charitable Association">
  <meta property="og:description" content="Community-focused charitable organization committed to education, health, sustainability, and development.">
  <meta property="og:type" content="website">

  <title>Ardaita and its Surrounding Charitable Association</title>

  <!-- Basic styling for loading screen -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #loading {
      text-align: center;
      color: #333;
    }
    #loading img {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
  }

  #app-loading {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    opacity: 1;
    transition: opacity 250ms ease;
  }

  #app-loading.loaded {
    opacity: 0;
  }

  .loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .loading-logo {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 24px;
  }

  .loading-title {
    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: #2e7d32;
    margin-bottom: 22px;
  }

  .loading-spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #e0e0e0;
    border-top-color: #2e7d32;
    border-radius: 50%;
    animation: ardaita-spin 0.8s linear infinite;
  }

  @keyframes ardaita-spin {
    to {
      transform: rotate(360deg);
    }
  }



  </style>
</head>
<body>

  <div id="app-loading">
    <div class="loading-content">
      <img
        src="assets/New_Logo.png"
        alt="Ardaita NGO logo"
        class="loading-logo"
      />

      <div class="loading-title">
        Loading Ardaita NGO Website...
      </div>

      <div class="loading-spinner"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loading');

      if (loader) {
        loader.classList.add('loaded');

        setTimeout(function () {
          loader.remove();
        }, 250);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>

</html>
